    - label: 과제
      text: 눈에 보이지 않는 방사선이 어디서 나오는지를 카메라 영상 위에 겹쳐 보여 주는 장치입니다. 감마선은 렌즈로 굽힐 수 없어서, 정해진 패턴으로 구멍을 뚫은 텅스텐 마스크(부호화 구경)의 그림자를 검출기로 받고, 계산으로 그 패턴을 풀어 방사선원의 위치를 찾습니다. 복원 알고리즘은 MIRE 연구실이, 영상 융합 소프트웨어와 FPGA 신호 처리는 제가 맡았습니다.
    - label: 한 일
      bullets:
      - 감마선 영상과 광학 카메라 영상을 융합해 보여 주는 소프트웨어(C#, WPF)를 개발했습니다.
      - 14bit ADC 신호의 피크 검출기를 MATLAB Simulink로 설계·시뮬레이션하고, Xilinx 도구로 코드를 생성해 ISE에서 Spartan-6 FPGA에 올려 실데이터로 확인했습니다.
      - 좌표 연산과 가우시안 모델을 이용한 데이터 분석을 MATLAB으로 수행했습니다.
    - label: 결과
      text: 영상 융합 방식 특허(KR102049518B1)에 발명자로 참여해 등록했고, 신기술인증(NET 1251)과 조달청 지정 납품 제품 선정(물품목록번호 41115414-24022693)을 거쳐 고리 원전 해체용 장비로 납품했습니다.
