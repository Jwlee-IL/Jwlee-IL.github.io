  projects:
  - id: legacy
    title: Portview 개발 담당
    period: 2024.08 – 현재
    status:
    - text: 출시 제품
      kind: ok
    role: 제품 개발 전반 — 장비 연동, 결함 수정, 빌드·릴리스, 검증 (단독)
    stack: C++17 · MFC · DCMTK · TWAIN · 센서 벤더 SDK · GitHub Actions
    blocks:
    - label: 과제
      text: 치과 영상 획득·뷰어 출시 제품 Portview(C++/MFC)를 2.2.5.16 버전부터 단독으로 맡아 2.2.5.22까지 릴리스했고, 미국/유럽 지사 대응도 하고 있습니다.
    - label: 문제
      text: 대표 사례로, 현장에서 센서 연결이 멈추거나 프로그램이 비정상 종료되는 결함이 반복해서 보고됐습니다.
    - label: 해결
      text: 현장 로그를 분석해 원인이 스레드 구조에 있다는 것을 찾았습니다. 센서 SDK의 알림(콜백)이 화면을 직접 건드리던 구조를, 화면 스레드만 상태를 바꾸고 SDK는 메시지로 알리기만 하는 구조로 바꿔 3개 센서(Handy, iRay, Hamamatsu)에 적용했습니다.
    - label: 결과
      text: 원인 확인 후 유닛 테스트로 결함 조건을 재현하며 3~4일 안에 고쳤고, 미국/유럽 지사에서 해소를 확인받았습니다.
    - label: 그 외
      bullets:
      - '센서: Handy(HDR500/600) 신규 연동과 iRay 오프라인 보정, Hamamatsu·Cruxell(GenX-CR) 호환 등 4개 제조사 센서에 대응했습니다.'
      - 'TWAIN: 앱이 TWAIN 데이터 소스로 영상을 넘기는 방식을 JPEG 파일 경유에서 메모리 버퍼 직접 전달로 바꾸고(구버전 데이터 소스는 파일 방식 유지), 테스트용 호스트로 전송 순서·해상도·크기 결함과 멈춤을 재현해 고쳤습니다.'
      - '영상·DICOM: 저장 과정에서 화소 간격(DPI·Pixel Spacing) 정보가 사라지던 원인을 추적해 고치고, RGB로 나가던 DICOM 출력을 DX 규격의 흑백으로 바로잡았습니다(파일 크기 1/3, 화소값 동일). 전송 판정은 실패를 재현하는 테스트용 PACS로 검증했습니다.'
      - '품질: 스레드·소요 시간을 기록하는 공용 로그를 전 모듈에 적용하고, 결함 대장 자동 집계, GitHub Actions 릴리스, 시험 성적서 부록 자동 생성을 갖췄습니다.'
    card: 출시 제품 Portview를 2024년 8월부터 단독으로 맡아 장비 연동, 결함 수정, 빌드·릴리스, 검증까지 담당
    highlight: 센서 3종 스레드 구조 재설계
    featured: true
  - id: rewrite
    title: 치과 영상 뷰어 .NET 재작성
    period: 2026.01 – 현재
    status:
    - text: 사내 QA 마무리 단계
      kind: warn
    role: 설계·개발 (단독)
    stack: C# · .NET 8/9 · WPF · MVVM · fo-dicom · NTwain · C++ · xUnit · FlaUI · NSIS
    blocks:
    - label: 과제
      text: C++/MFC로 된 Portview를 .NET WPF 기반의 차세대 제품으로 새로 설계해 만드는 일을 단독으로 맡았습니다.
    - label: 한 일
      bullets:
      - 센서 4종과 구강 카메라를 연동하고, 외부 영상 프로그램이 이 앱에서 영상을 받아 가는 창구(TWAIN 데이터 소스)를 C++로 새로 작성했습니다.
      - DICOM 조회·전송·수신·인쇄, 장비 업로드를 받는 FTP 서버, CD 굽기(IMAPI2)를 구현했습니다.
      - 기존 영상처리 DLL 두 개를 MFC 의존이 없는 DLL 하나로 합쳤습니다.
      - UI 라이브러리 없이 영상 주석 캔버스를 직접 구현했습니다(펜·화살표·텍스트·각도 측정, 확대·이동·회전, 각도·크기 조절 Adorner, 실행 취소).
    - label: 검증
      text: 합친 DLL은 회귀 샘플 11개로 리팩터링 전후 출력이 바이트 단위로 같은지 확인하며 다듬었고, UI 자동화를 포함한 자동 테스트 360여 개와 빌드·테스트 CI 게이트를 갖췄습니다.
    card: C++/MFC 영상 획득·뷰어를 .NET WPF 기반으로 새로 설계
    highlight: 자동 테스트 360여 개
