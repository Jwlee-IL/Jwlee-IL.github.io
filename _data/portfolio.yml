intro: 원자력 발전소용 방사선 계측 장비(6년 9개월)를 거쳐, 지금은 치과 영상 장비의 영상 획득·뷰어 소프트웨어를 만드는 9년 차 개발자입니다.
highlights:
- title: 현장 센서 연결 결함의 원인 해결
  text: Portview의 센서 연결 멈춤·비정상 종료 결함을 현장 로그로 추적해 3개 센서의 스레드 구조를 재설계했고, 미국/유럽 지사에서 해소를 확인받았습니다.
  link: legacy
- title: 원전 납품 장비와 등록 특허
  text: 방사선 영상 장치 G-CAM으로 특허 등록과 신기술인증(NET 1251)을 받아 고리 원전에 납품했고, 검증·교정 장비는 한빛·월성 원전에 납품했습니다.
  link: gcam-device
- title: 치과 영상 뷰어 .NET 재작성
  text: 센서 4종, TWAIN, DICOM을 단독으로 구현하고 자동 테스트 360여 개를 갖춰, 현재 사내 QA 마무리 단계에 있습니다.
  link: rewrite
how:
  eyebrow: Working style
  title: 일하는 방식
  intro: 무엇을 만들지 정하고 결과가 맞는지 확인하는 일은 제 책임으로 둡니다. 2026년부터는 Claude Code, Codex 같은 AI 코딩 에이전트를 개발 도구로 쓰며, 커밋에도 공동 작성자로 남깁니다.
  items:
  - title: 잣대부터 세우기
    text: 손대기 전에 측정 기준을 만들고, 고친 뒤에는 코드를 되돌려 테스트가 실제로 결함을 잡는지 확인합니다.
  - title: 근거를 요구하고, 판단은 직접
    text: 3D 뷰어에서는 에이전트가 기준값마다 규격·문헌·실측 등 어떤 근거인지 밝히고, 근거보다 앞선 주장은 좁히도록 반복해 교정했습니다. 그 과정에서 즉시 식립 기준으로 널리 인용되던 '뿌리 끝 아래 뼈 높이 3mm'가 권고가 아니라 문헌고찰의 선정 기준이었음을 잡아냈습니다.
  - title: 정리해서 나누기
    text: C#·설계와 AI 에이전트 활용법(근거를 요구하는 지시문 작성, 컨텍스트와 토큰 관리)을 사내 위키에 정리해 팀에 공유합니다.
