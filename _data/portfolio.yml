    role: 설계·개발 (단독)
    stack: Python · VTK · trame · ONNX Runtime · pydicom · pynetdicom · FastAPI
    blocks:
    - label: 과제
      text: CBCT 영상을 3D로 보고, 임플란트 계획을 세우고, 판독 소견서를 DICOM 문서로 PACS에 보내는 흐름을 하나로 묶는 프로젝트입니다.
    - label: 한 일
      bullets:
      - VTK 기반 코어 하나에 웹, REST API, 데스크톱 화면을 갈아 끼울 수 있도록 계층을 나눴습니다.
      - 사내 AI팀의 세그멘테이션 모델을 통합하면서, 3D 렌더링과 AI 추론이 한 프로세스에서 GPU 자원을 두고 부딪히지 않도록 추론을 별도 프로세스로 분리했습니다. GPU 종류에 따라 실행 경로(CUDA·DirectML·CPU)는 자동으로 고릅니다.
      - 곡면 파노라마, 하악관(신경관) 검출, 임플란트 식립 제안, 판독 소견서의 DICOM 전송을 구현했습니다.
    - label: 검증
