    - summary: 원전 제어 계통 루프 검증기와 격리계통 방사능 루프 교정 장치를 개발해 한빛·월성 원전에 납품했습니다. 전원 공급기 정비 시스템으로 점검을 자동화했고, 외부 견적(1억원 이상) 대신 사내 전자 문서 관리 시스템을 직접 구축해 장비 비용 500만원으로 도입했습니다. In-Mast Sipping 기법으로 고리·월성·한빛 원전의 손상 핵연료 검출 정비 업무도 함께 수행했습니다.
